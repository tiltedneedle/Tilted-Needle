# Scheduled content sync.
#
# WHY THIS EXISTS ALONGSIDE vercel.json's cron
#
# Vercel's Hobby plan permits one cron run per day. That is the whole reason
# this file is here: a client's post could otherwise sit up to 24 hours before
# anything noticed it, and since the approval queue landed, that is 24 hours
# before anyone can even approve it. GitHub Actions schedules are free on
# public repositories, so the fix costs nothing and needs no plan change.
#
# The two schedules are deliberately BOTH kept, and they are not redundant:
#
#   - Vercel's 06:00 UTC run is the floor. GitHub disables scheduled workflows
#     in repositories with no activity for 60 days, so this file cannot be the
#     only thing keeping data fresh.
#   - This workflow adds 03:25 / 09:25 / 15:25 / 21:25, offset three hours from
#     the Vercel run. Worst-case staleness drops from 24 hours to 6.
#
# Running more often is safe because metered spend is NOT governed by how often
# this fires. Metrics refresh only when a post's age band says it is due
# (scrape_schedule.interval_days), and metered discovery is gated by a 10-day
# per-account cooldown. Firing five times a day asks those questions five times
# and gets "not yet" for most of them. Only YouTube's free quota sees more use,
# and it resets daily.
#
# The :25 offset is intentional. GitHub queues scheduled jobs on a shared pool
# and runs starting on the hour are the most delayed; an odd offset gets picked
# up sooner.
#
# SETUP -- this workflow no-ops until you do this once:
#   Repo Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: CRON_SECRET     Value: the same value set in the Vercel project
# Until then every run exits green with a "not configured" note rather than
# failing, so an unconfigured repo does not mail you a red X four times a day.
#
# The secret is masked in logs by Actions and is never exposed to pull requests
# from forks, which matters here because this repository is public.

name: sync

on:
  schedule:
    - cron: "25 3,9,15,21 * * *"
  # Lets you force a run from the Actions tab -- useful right after adding an
  # account instead of waiting for the next slot.
  workflow_dispatch:

# A full run across ~30 accounts takes over a minute and writes snapshots.
# Two overlapping runs would double-read the same accounts for no benefit, so
# a late run waits rather than racing. Never cancel one mid-flight: it would
# leave the tail of the account list unsynced.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Four platforms, each up to a few batches. Generous on purpose: the point
    # of batching is that no single REQUEST can hang, so the job timeout is a
    # backstop rather than the thing keeping runs honest.
    timeout-minutes: 30
    steps:
      - name: Trigger sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Change here if the production domain ever moves.
          SITE_URL: https://tilted-needle0.vercel.app
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set on this repository -- nothing to do."
            echo "See the setup note at the top of .github/workflows/sync.yml."
            exit 0
          fi

          # A 401 here is ambiguous in the worst way: the secret is present, so
          # nothing looks unset, but it does not match Vercel's. Printing the
          # length and a truncated SHA-256 makes the two comparable without
          # ever revealing either -- a 32-bit hash is not reversible, and it
          # turns "wrong somehow" into "wrong by this much". The usual culprits
          # are a trailing newline, surrounding quotes, or the whole
          # NAME=value line pasted in as the value.
          echo "secret length     : $(printf '%s' "${CRON_SECRET}" | wc -c)"
          echo "secret fingerprint: $(printf '%s' "${CRON_SECRET}" | sha256sum | cut -c1-8)"

          # ONE PLATFORM PER REQUEST.
          #
          # The first live run asked for everything at once and took over ten
          # minutes: ~30 accounts of metrics plus nine blocking TikTok actor
          # runs, well past the route's 300-second maxDuration. It only
          # finished because curl retried the timeout and the retries did the
          # work in pieces -- so the job reported a red X for a sync that had
          # actually succeeded, which is the worst possible signal.
          #
          # Split by platform and each request is bounded and independently
          # meaningful. A slow vendor can no longer starve the others.
          # Accounts per request, sized from measurement rather than guesswork.
          #
          # Timing a single account against production: 7s, 18s, 15s, 14s in
          # steady state, and Instagram around 27s. Four of those is roughly a
          # minute -- far inside the route's 300s ceiling.
          #
          # Four rather than six because of the outlier. One account that has
          # a discovery backlog took 233 SECONDS on its own, and a batch of
          # six could pair that with five normal ones and blow the limit
          # anyway. At four, the worst realistic batch is 233 + 3x15 = 278s,
          # which still lands. Two backlogged accounts together would still
          # time out; that is rare, and the stalest-first ordering means the
          # next run simply picks them up.
          MAX=4
          # Safety stop. Six batches of six is far more than the ~14 accounts
          # any one platform has; this only exists so a bug cannot loop.
          BATCHES=6

          # Pinned once, before any request. Every batch asks only for
          # accounts not synced since this instant, which is what makes the
          # loop terminate: without it the stalest-first ordering merely
          # rotates, and batch four returns the four accounts batch one just
          # finished -- a full batch, forever.
          STALE_BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "syncing accounts not seen since ${STALE_BEFORE}"

          fail=0
          for platform in instagram tiktok youtube youtube_shorts; do
           for batch in $(seq 1 ${BATCHES}); do
            # No --retry. Retrying a half-finished sync re-runs expensive work
            # for a request that may well have committed most of it, and the
            # stalest-first ordering already makes the NEXT scheduled run pick
            # up whatever this one missed. --max-time just above the route's
            # own 300s ceiling so a hung call fails rather than hanging.
            code=$(curl -sS -o body.json -w '%{http_code}' \
              --max-time 320 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${SITE_URL}/api/sync?platform=${platform}&max=${MAX}&staleBefore=${STALE_BEFORE}")

            # Print the body before judging it: on failure this is the only
            # record of WHY, and a 401 means the secret drifted from Vercel.
            echo "--- ${platform} batch ${batch}: HTTP ${code}"
            cat body.json
            echo

            if [ "${code}" != "200" ] || ! grep -q '"ok":true' body.json; then
              echo "::error::${platform} sync failed (HTTP ${code})"
              fail=1
              # Give up on THIS platform but keep going with the others. One
              # dead provider must not hide the results of the three that
              # worked.
              break
            fi

            # Two reasons to stop asking. A short batch means the platform is
            # finished. Zero synced means nothing moved -- every account came
            # back skipped, so another identical request would return the same
            # accounts forever.
            node -e '
              const fs = require("fs");
              const r = JSON.parse(fs.readFileSync("body.json", "utf8"));
              const line = `'"${platform}"' batch '"${batch}"': synced ${r.synced}/${r.accounts} · ${r.postsCreated} new posts · ${r.snapshotsWritten} snapshots · ${r.failed} failed`;
              console.log(line);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
              fs.writeFileSync("counts.txt", `${r.accounts} ${r.synced}`);
            '
            processed=$(cut -d" " -f1 counts.txt)
            synced=$(cut -d" " -f2 counts.txt)

            if [ "${processed}" -lt "${MAX}" ] || [ "${synced}" -eq 0 ]; then
              break
            fi
           done
          done

          exit ${fail}
