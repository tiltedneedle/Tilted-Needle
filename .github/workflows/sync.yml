# Scheduled content sync.
#
# WHY THIS EXISTS ALONGSIDE vercel.json's cron
#
# Vercel's Hobby plan permits one cron run per day. That is the whole reason
# this file is here: a client's post could otherwise sit up to 24 hours before
# anything noticed it, and since the approval queue landed, that is 24 hours
# before anyone can even approve it. GitHub Actions schedules are free on
# public repositories, so the fix costs nothing and needs no plan change.
#
# The two schedules are deliberately BOTH kept, and they are not redundant:
#
#   - Vercel's 06:00 UTC run is the floor. GitHub disables scheduled workflows
#     in repositories with no activity for 60 days, so this file cannot be the
#     only thing keeping data fresh.
#   - This workflow adds 03:25 / 09:25 / 15:25 / 21:25, offset three hours from
#     the Vercel run. Worst-case staleness drops from 24 hours to 6.
#
# Running more often is safe because metered spend is NOT governed by how often
# this fires. Metrics refresh only when a post's age band says it is due
# (scrape_schedule.interval_days), and metered discovery is gated by a 10-day
# per-account cooldown. Firing five times a day asks those questions five times
# and gets "not yet" for most of them. Only YouTube's free quota sees more use,
# and it resets daily.
#
# The :25 offset is intentional. GitHub queues scheduled jobs on a shared pool
# and runs starting on the hour are the most delayed; an odd offset gets picked
# up sooner.
#
# SETUP -- this workflow no-ops until you do this once:
#   Repo Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: CRON_SECRET     Value: the same value set in the Vercel project
# Until then every run exits green with a "not configured" note rather than
# failing, so an unconfigured repo does not mail you a red X four times a day.
#
# The secret is masked in logs by Actions and is never exposed to pull requests
# from forks, which matters here because this repository is public.

name: sync

on:
  schedule:
    - cron: "25 3,9,15,21 * * *"
  # Lets you force a run from the Actions tab -- useful right after adding an
  # account instead of waiting for the next slot.
  workflow_dispatch:

# A full run across ~30 accounts takes over a minute and writes snapshots.
# Two overlapping runs would double-read the same accounts for no benefit, so
# a late run waits rather than racing. Never cancel one mid-flight: it would
# leave the tail of the account list unsynced.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Four platforms, each up to a few batches. Generous on purpose: the point
    # of batching is that no single REQUEST can hang, so the job timeout is a
    # backstop rather than the thing keeping runs honest.
    #
    # 45, up from 30. A platform answering slowly now costs more requests
    # rather than a dead one, and the ceiling for a single platform is six
    # requests of up to five minutes each. A backstop that the slowest honest
    # run can reach is not a backstop.
    timeout-minutes: 45
    steps:
      - name: Trigger sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Change here if the production domain ever moves.
          SITE_URL: https://tilted-needle0.vercel.app
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set on this repository -- nothing to do."
            echo "See the setup note at the top of .github/workflows/sync.yml."
            exit 0
          fi

          # A 401 here is ambiguous in the worst way: the secret is present, so
          # nothing looks unset, but it does not match Vercel's. Printing the
          # length and a truncated SHA-256 makes the two comparable without
          # ever revealing either -- a 32-bit hash is not reversible, and it
          # turns "wrong somehow" into "wrong by this much". The usual culprits
          # are a trailing newline, surrounding quotes, or the whole
          # NAME=value line pasted in as the value.
          echo "secret length     : $(printf '%s' "${CRON_SECRET}" | wc -c)"
          echo "secret fingerprint: $(printf '%s' "${CRON_SECRET}" | sha256sum | cut -c1-8)"

          # ONE PLATFORM PER REQUEST.
          #
          # The first live run asked for everything at once and took over ten
          # minutes: ~30 accounts of metrics plus nine blocking TikTok actor
          # runs, well past the route's 300-second maxDuration. It only
          # finished because curl retried the timeout and the retries did the
          # work in pieces -- so the job reported a red X for a sync that had
          # actually succeeded, which is the worst possible signal.
          #
          # Split by platform and each request is bounded and independently
          # meaningful. A slow vendor can no longer starve the others.
          # Accounts per request, sized from measurement rather than guesswork.
          #
          # Timing a single account against production: 7s, 18s, 15s, 14s in
          # steady state, and Instagram around 27s. Four of those is roughly a
          # minute -- far inside the route's 300s ceiling.
          #
          # Four rather than six because of the outlier. One account that has
          # a discovery backlog took 233 SECONDS on its own, and a batch of
          # six could pair that with five normal ones and blow the limit
          # anyway. At four, the worst realistic batch is 233 + 3x15 = 278s,
          # which still lands. Two backlogged accounts together would still
          # time out; that is rare, and the stalest-first ordering means the
          # next run simply picks them up.
          #
          # MAX is not what keeps a request inside the limit, and it never
          # could be: it bounds how many accounts a request takes on, not how
          # long they take. From 24 September TikTok began answering slowly on
          # about half the runs. The same four accounts went from under a
          # minute to four or five, the request after them was killed at 300s,
          # and nine runs in nine days failed on it. The route now stops
          # starting work 180s in and reports what is left instead (see
          # src/lib/syncBudget.ts), so a slow platform costs extra requests
          # rather than a 504.
          MAX=4
          # Safety stop. Six requests of up to four accounts is far more than
          # the nine any one platform has, with room for the requests a slow
          # day cuts short; this only exists so a bug cannot loop.
          BATCHES=6

          # Pinned once, before any request. Every batch asks only for
          # accounts not synced since this instant, which is what makes the
          # loop terminate: without it the stalest-first ordering merely
          # rotates, and batch four returns the four accounts batch one just
          # finished -- a full batch, forever.
          STALE_BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "syncing accounts not seen since ${STALE_BEFORE}"

          fail=0
          for platform in instagram tiktok youtube youtube_shorts; do
           # Accounts this pass has not finished, as the route last reported it.
           remaining=0
           retried=0
           gave_up=0
           for batch in $(seq 1 ${BATCHES}); do
            # No curl --retry: it would re-send blindly, for every platform and
            # every kind of failure. The one case where asking again is right
            # is handled explicitly below. --max-time just above the route's
            # own 300s ceiling so a hung call fails rather than hanging.
            #
            # `|| true` because a curl that cannot connect exits non-zero, and
            # under `set -e` that ended the whole script on the spot -- taking
            # the platforms after it down too. It reports HTTP 000 instead and
            # is judged like any other failed request. The old body is removed
            # first so a request that returned nothing cannot be printed, or
            # parsed, as the previous one's answer.
            rm -f body.json
            code=$(curl -sS -o body.json -w '%{http_code}' \
              --max-time 320 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${SITE_URL}/api/sync?platform=${platform}&max=${MAX}&staleBefore=${STALE_BEFORE}") || true

            # Print the body before judging it: on failure this is the only
            # record of WHY, and a 401 means the secret drifted from Vercel.
            echo "--- ${platform} batch ${batch}: HTTP ${code}"
            if [ -f body.json ]; then cat body.json; fi
            echo

            if [ "${code}" != "200" ]; then
              # A 504 is the function killed at its time limit, and by then it
              # has usually finished most of the batch: when the 1 October
              # evening run failed this way, the order the next run took the
              # accounts in shows the request that died had already synced
              # three of its four. Those are stamped, and STALE_BEFORE is
              # pinned, so asking again repeats none of them -- it carries on
              # with what was left. Once per platform, so a route that times
              # out every time still fails the run.
              #
              # Not for Instagram. Its reads are paid for, and the account that
              # was mid-flight when the function died would be billed twice.
              if [ "${code}" = "504" ] && [ "${retried}" -eq 0 ] && [ "${platform}" != "instagram" ]; then
                retried=1
                echo "::warning::${platform}: batch ${batch} timed out (HTTP 504); asking again for what it left"
                continue
              fi
              echo "::error::${platform} sync failed (HTTP ${code})"
              fail=1
              gave_up=1
              # Give up on THIS platform but keep going with the others. One
              # dead provider must not hide the results of the three that
              # worked.
              break
            fi

            node -e '
              const fs = require("fs");
              const r = JSON.parse(fs.readFileSync("body.json", "utf8"));
              // A deployment from before the route reported `remaining` still
              // says enough to work it out.
              const remaining = r.remaining ?? Math.max(0, (r.eligible ?? 0) - r.accounts);
              const extra = (r.partial ? ` · ${r.partial} cut short` : "") + (r.unread ? ` · ${r.unread} posts unread` : "");
              const line = `'"${platform}"' batch '"${batch}"': synced ${r.synced}/${r.accounts} · ${r.postsCreated} new posts · ${r.snapshotsWritten} snapshots · ${r.failed} failed${extra} · ${remaining} left · ${Math.round((r.durationMs ?? 0) / 1000)}s`;
              console.log(line);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
              fs.writeFileSync("counts.txt", `${r.accounts} ${r.synced} ${remaining} ${r.failed ?? 0}`);
            '
            processed=$(cut -d" " -f1 counts.txt)
            synced=$(cut -d" " -f2 counts.txt)
            remaining=$(cut -d" " -f3 counts.txt)
            errored=$(cut -d" " -f4 counts.txt)

            # Partial and total failure are different events and must not share
            # a signal.
            #
            # The route's `ok` is now honest -- false whenever ANY account
            # errored -- so keying the run on it would paint the workflow
            # permanently red for one deleted Instagram page and train everyone
            # to ignore the colour. That is how the old always-true version did
            # its damage in reverse.
            #
            # So: a batch where nothing synced but something errored is a real
            # outage and fails the run. Anything less is a warning, which
            # annotates the run and the summary without crying wolf. The
            # accounts that failed are retried on the next pass anyway, because
            # a failure leaves last_synced_at alone and stalest-first puts them
            # at the front.
            if [ "${errored}" -gt 0 ] && [ "${synced}" -eq 0 ]; then
              echo "::error::${platform}: every account in this batch failed (${errored})"
              fail=1
              gave_up=1
              break
            fi
            if [ "${errored}" -gt 0 ]; then
              echo "::warning::${platform}: ${errored} of ${processed} accounts failed this batch"
            fi

            # WHEN TO STOP: when the route says the pass has nothing left.
            #
            # A short batch cannot be the signal. It used to mean "that was the
            # end of the list"; now it also means "the time budget ran out",
            # and stopping there is how accounts would get left behind.
            #
            # "Nothing was written" is not a safe signal either: whether a post
            # is due depends on its own age band, not its account's staleness,
            # so a recently-synced account can hold the only work there is.
            #
            # This used to work out how many requests a pass needs from
            # `eligible` and stop at that many. But `eligible` is counted as
            # each request begins, so it shrinks as the pass goes: nine
            # accounts read "three requests" on the first and "two" on the
            # second, and the loop stopped after two. Instagram and TikTok
            # have nine accounts each, and in all sixty runs checked up to
            # 2 October each of them synced eight.
            #
            # `synced` at zero is the other way out: a request that finished
            # nothing will not be improved on by sending it again.
            if [ "${remaining}" -eq 0 ] || [ "${synced}" -eq 0 ]; then
              break
            fi
           done

           # The pass did not finish: the platform was too slow for the
           # requests it was allowed, or made no progress. A warning rather
           # than a failure, on the same reasoning as above -- nothing is
           # broken, and stalest-first means these are exactly the accounts
           # the next run starts with. A platform that is actually down fails
           # the run through the two checks inside the loop.
           if [ "${gave_up}" -eq 0 ] && [ "${remaining}" -gt 0 ]; then
             echo "::warning::${platform}: ${remaining} account(s) not finished this run; they are first in line for the next"
           fi
          done

          exit ${fail}
