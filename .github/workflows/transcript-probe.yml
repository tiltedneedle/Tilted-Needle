# Can a GitHub runner fetch transcripts at all?
#
# This tests an ASSUMPTION, not a feature. The whole architecture splits jobs
# into "safe" and "fragile" on the premise that yt-dlp is refused from
# datacenter IP ranges, which is why transcripts wait on an Oracle host that
# has never had capacity. That premise was never tested from a runner -- it was
# inherited from how YouTube's timedtext endpoint behaves for plain HTTP.
#
# yt-dlp is a different client with different handling, so the premise may
# simply be wrong. If it is, the fragile half stops being fragile, transcripts
# become autonomous today, and Oracle turns into an optimisation rather than a
# blocker.
#
# Deliberately read-only: it fetches one public transcript and reports what
# happened. It writes nothing to the database.

name: transcript-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet yt-dlp

      - name: Try a YouTube transcript from this runner
        run: |
          python - <<'PY'
          import yt_dlp

          # A well-known public video with auto-captions. Nothing about the
          # result depends on this workspace's data.
          VIDEO = "https://www.youtube.com/watch?v=OcT01xFp8wM"

          opts = {
              "quiet": True, "no_warnings": True, "skip_download": True,
              "writesubtitles": True, "writeautomaticsub": True,
              "subtitlesformat": "json3",
          }
          try:
              with yt_dlp.YoutubeDL(opts) as ydl:
                  info = ydl.extract_info(VIDEO, download=False) or {}
                  auto = info.get("automatic_captions") or {}
                  manual = info.get("subtitles") or {}
                  tracks = list(manual) or list(auto)
                  print(f"caption languages offered: {len(tracks)}")
                  if not tracks:
                      print("RESULT: no tracks -- runner appears refused or video has none")
                      raise SystemExit(0)

                  src = (manual or auto)[tracks[0]]
                  j3 = next((e for e in src if e.get("ext") == "json3"), src[0])
                  body = ydl.urlopen(j3["url"]).read()
                  print(f"RESULT: fetched {len(body)} bytes of caption data")
                  print("VERDICT: PASS -- a datacenter runner CAN fetch transcripts"
                        if len(body) > 500 else
                        "VERDICT: EMPTY -- refused (proof-of-origin), as assumed")
          except Exception as e:
              print(f"VERDICT: FAIL -- {type(e).__name__}: {str(e)[:200]}")
          PY
