# Can a datacenter runner fetch a YouTube transcript?
#
# This decides whether the project needs a host at all. Transcripts are the ONLY
# job that cannot run on GitHub Actions, and that single fact is what makes an
# Oracle instance necessary — an instance Singapore has refused across every
# fault domain and size for days.
#
# RESULT 1 (2026-08-10, run 31432973678): FAIL with yt-dlp defaults.
#   "Sign in to confirm you're not a bot."
#   That established the safe/fragile split was correct — but it tested only
#   the DEFAULT client, which is the configuration YouTube blocks hardest. It
#   did not test the actual countermeasure.
#
# RESULT 2 (this run): three strategies, because "a datacenter IP is refused"
# and "yt-dlp's default client is refused from a datacenter IP" are different
# claims, and only the second was ever demonstrated:
#
# RESULT 2 (2026-08-10, run 31444004222): ALL SEVEN STRATEGIES FAIL.
#   A default            "Sign in to confirm you're not a bot"
#   B android             same
#   B ios                 same
#   B tv_embedded         same
#   B web_safari          same
#   B mweb                same
#   C PO token provider   no caption tracks reached at all
#
# The refusal happens at the IP LEVEL, before client selection or token
# generation can matter -- every client got the identical challenge. This is
# now settled rather than assumed: transcripts CANNOT run on GitHub Actions,
# and the safe/fragile split is load-bearing, not a precaution. A host with a
# non-datacenter IP is genuinely required.
#
#   A  default            the known-failing baseline, kept as a control
#   B  alternate clients  android/ios/tv_embedded speak different endpoints,
#                         several of which do not demand a proof-of-origin
#                         token at all
#   C  PO token provider  bgutil generates the token the web client requires;
#                         this is the documented countermeasure and has never
#                         been tried here
#
# If B or C succeeds, transcripts move to Actions and the Oracle dependency
# disappears entirely rather than being waited on.

name: transcript-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install --quiet --upgrade yt-dlp

      - name: A — default client (control, expected to fail)
        continue-on-error: true
        run: |
          python - <<'PY'
          import yt_dlp
          V = "OcT01xFp8wM"
          try:
              with yt_dlp.YoutubeDL({"quiet": True, "skip_download": True,
                                     "writeautomaticsub": True}) as y:
                  i = y.extract_info(f"https://www.youtube.com/watch?v={V}", download=False) or {}
              n = len(i.get("automatic_captions") or {}) + len(i.get("subtitles") or {})
              print(f"A RESULT: {'PASS' if n else 'FAIL'} — {n} caption languages")
          except Exception as e:
              print(f"A RESULT: FAIL — {str(e)[:160]}")
          PY

      - name: B — alternate player clients
        continue-on-error: true
        run: |
          python - <<'PY'
          import yt_dlp
          V = "OcT01xFp8wM"
          # Each client is a different endpoint with its own bot-check posture.
          for client in ["android", "ios", "tv_embedded", "web_safari", "mweb"]:
              try:
                  opts = {"quiet": True, "no_warnings": True, "skip_download": True,
                          "writeautomaticsub": True,
                          "extractor_args": {"youtube": {"player_client": [client]}}}
                  with yt_dlp.YoutubeDL(opts) as y:
                      i = y.extract_info(f"https://www.youtube.com/watch?v={V}", download=False) or {}
                  auto, man = i.get("automatic_captions") or {}, i.get("subtitles") or {}
                  n = len(auto) + len(man)
                  if n:
                      # A listing is not a transcript. Fetch the actual text.
                      tracks = (man or auto)
                      lang = next((l for l in tracks if l.startswith("en")), next(iter(tracks)))
                      url = next((t["url"] for t in tracks[lang] if t.get("ext") == "json3"),
                                 tracks[lang][0]["url"])
                      with yt_dlp.YoutubeDL(opts) as y:
                          body = y.urlopen(url).read().decode("utf-8", "replace")
                      print(f"B[{client}]: PASS — {n} langs, body {len(body)} bytes"
                            f" {'(EMPTY — PoToken refusal)' if len(body) < 50 else '(REAL TRANSCRIPT)'}")
                  else:
                      print(f"B[{client}]: no caption tracks")
              except Exception as e:
                  print(f"B[{client}]: FAIL — {str(e)[:110]}")
          PY

      - name: C — with a PO token provider
        continue-on-error: true
        run: |
          pip install --quiet bgutil-ytdlp-pot-provider || echo "plugin install failed"
          python - <<'PY'
          import yt_dlp
          V = "OcT01xFp8wM"
          try:
              opts = {"quiet": True, "no_warnings": True, "skip_download": True,
                      "writeautomaticsub": True}
              with yt_dlp.YoutubeDL(opts) as y:
                  i = y.extract_info(f"https://www.youtube.com/watch?v={V}", download=False) or {}
              tracks = i.get("subtitles") or i.get("automatic_captions") or {}
              if not tracks:
                  print("C RESULT: FAIL — no caption tracks")
              else:
                  lang = next((l for l in tracks if l.startswith("en")), next(iter(tracks)))
                  url = next((t["url"] for t in tracks[lang] if t.get("ext") == "json3"),
                             tracks[lang][0]["url"])
                  with yt_dlp.YoutubeDL(opts) as y:
                      body = y.urlopen(url).read().decode("utf-8", "replace")
                  print(f"C RESULT: body {len(body)} bytes"
                        f" {'(EMPTY — still refused)' if len(body) < 50 else '(REAL TRANSCRIPT — Oracle not needed)'}")
          except Exception as e:
              print(f"C RESULT: FAIL — {str(e)[:200]}")
          PY
