# TEMPORARY. Runs merge-themes for real, but cannot turn the repo red.
#
# merged_themes has never been written successfully -- the script always died
# at the embedding call -- so the merge and insert path below it is unproven.
# Proving it on the scheduled pipeline would mean discovering any remaining
# fault as a failed run, which emails the owner. That is the one outcome this
# work exists to stop.
#
# So the same command runs here first, with its exit code captured and
# reported rather than propagated. The work it does is REAL: a successful run
# populates merged_themes exactly as the pipeline would. Deleted once green.

name: embed-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Merge themes (failure reported, not propagated)
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          set +e
          node --experimental-strip-types --import ./scripts/register-alias.mjs \
            scripts/merge-themes.mjs 2>&1 | tee /tmp/merge.log
          rc=${PIPESTATUS[0]}
          echo "## merge-themes exit code: $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -40 /tmp/merge.log >> "$GITHUB_STEP_SUMMARY"
          exit 0
