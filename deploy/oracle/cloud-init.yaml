#cloud-config
# Host setup for the Tilted Needle ingest worker
# (PRD-video-intelligence §15.3).
#
# The instance is cattle: everything here is reproducible from this file plus
# provision.py, and all state lives in Supabase. If Oracle reclaims the box,
# recovery is re-running the script -- not restoring anything.
#
# Note what is NOT here: no web server, no reverse proxy, no certificates, no
# open ports. The worker polls outward and serves nothing (§4.2).

package_update: true
package_upgrade: true

packages:
  - unattended-upgrades
  - curl
  - ca-certificates
  - git

write_files:
  # Unattended security patches. The box runs unwatched for weeks at a time.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /etc/systemd/system/tn-worker.service
    content: |
      [Unit]
      Description=Tilted Needle ingest worker
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=worker
      WorkingDirectory=/opt/tn-worker
      # Secrets are injected at deploy time, root-owned and 0600. They exist
      # nowhere else: not in the repo, not in Vercel's environment, not in any
      # client bundle (§4.7).
      EnvironmentFile=/etc/tn-worker.env
      # --kinds EXCLUDES transcript, and the exclusion was proved the hard
      # way: this box's first 90 seconds settled five videos as "no caption
      # tracks published" that had simply refused its datacenter IP -- the
      # same silent poisoning the GitHub runner produced before p_kinds was
      # honoured. YouTube's timedtext turns an untrusted address into an
      # EMPTY track list, not an error, so the code cannot tell "blocked"
      # from "has no captions". Transcripts belong to a host whose IP
      # YouTube trusts (the desktop runner); everything else is IP-blind
      # and runs here.
      # KEEP IN STEP WITH THE LIVE BOX. transcript_asr and describe were added
      # here after an audit found this list had drifted: the hourly
      # tn-enqueue-asr timer below was planning transcript_asr jobs that a
      # rebuilt box would never have been allowed to claim, so the queue would
      # fill and nothing would drain it -- silently, since an unclaimed job
      # looks exactly like a job waiting its turn. The live box only worked
      # because of a drop-in edited by hand, which is precisely the state this
      # file exists to make reproducible.
      #
      # `transcript` stays OUT: YouTube refuses this datacenter address for
      # captions, and enabling it here re-poisons the queue (deploy_worker.py
      # refuses to leave a host running with it). transcript_asr is a
      # different kind for exactly that reason -- Instagram serves audio to
      # this address where YouTube serves nothing.
      ExecStart=/usr/bin/node --experimental-strip-types --import /opt/tn-worker/scripts/register-alias.mjs /opt/tn-worker/worker/index.mjs --kinds=comments,analyse,vision_extract,weekly_read,transcript_asr,describe
      # A crash must not take the pipeline down until someone notices.
      Restart=always
      RestartSec=10
      # journald with a cap: a chatty loop must never fill the boot volume.
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=tn-worker

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/tn-transcript.service
    permissions: "0644"
    content: |
      [Unit]
      # The yt-dlp transcript service. Transcripts are the one job that cannot
      # run on a shared cloud runner -- YouTube's timedtext endpoint requires a
      # proof-of-origin token and refuses datacenter ranges outright -- so it
      # lives here, on the same host as the worker that calls it.
      Description=Tilted Needle transcript service (yt-dlp)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=worker
      WorkingDirectory=/opt/tn-transcript
      EnvironmentFile=/etc/tn-worker.env
      # Bound to loopback ON PURPOSE. The worker calls it from this same box,
      # so binding a public interface would expose an unauthenticated-by-
      # default scraper to the internet for no gain (S4.2: zero inbound).
      ExecStart=/opt/tn-transcript/venv/bin/python /opt/tn-transcript/server.py
      Environment=HOST=127.0.0.1
      # A signed-in YouTube cookie jar, if one has been placed. Optional: the
      # service runs without it and simply cannot fetch YouTube captions from
      # a datacenter address, which is the documented state of affairs. Put a
      # Netscape-format export here (0600, root-owned) to try the one
      # countermeasure YouTube names. Use a THROWAWAY Google account -- yt-dlp
      # warns that cookies used this way can get an account flagged.
      Environment=YTDLP_COOKIES=/etc/tn-youtube-cookies.txt
      # A residential proxy, if one is bought. This is the ONLY measure that
      # addresses the real cause: YouTube refuses this host by ADDRESS, before
      # client choice or token generation matter. Captions are tens of KB, so
      # a per-GB residential plan costs cents for the whole library. Empty is
      # fine and is the default -- the desktop runner already has a
      # residential address.
      Environment=YTDLP_PROXY=
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=tn-transcript

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/tn-enqueue-asr.service
    permissions: "0644"
    content: |
      [Unit]
      # Plans transcript_asr jobs. THIS HOST AND NO OTHER, which is why it is a
      # timer here rather than a step in the GitHub pipeline: planTranscriptAsr
      # asks the transcript service whether it actually has an audio route, and
      # on a GitHub runner the honest answer is no. Left to the pipeline alone,
      # these jobs would simply never be planned -- and the failure would be
      # silent, because "planned nothing" and "nothing to plan" look identical
      # in the log.
      Description=Plan transcript_asr jobs (the only host with an audio route)
      After=network-online.target tn-transcript.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=worker
      WorkingDirectory=/opt/tn-worker
      EnvironmentFile=/etc/tn-worker.env
      # --backfill, because the per-run cap is the wrong throttle here: the
      # worker meters transcript_asr at 20/hour with a token bucket, so the
      # drain is already governed and capping the enqueue only starves it.
      # Backfilled jobs enter at priority 500, behind anything live.
      ExecStart=/usr/bin/node --experimental-strip-types --import /opt/tn-worker/scripts/register-alias.mjs /opt/tn-worker/worker/enqueue.mjs --kinds=transcript_asr --backfill
      SyslogIdentifier=tn-enqueue-asr

  - path: /etc/systemd/system/tn-enqueue-asr.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Plan transcript_asr jobs hourly

      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=1h
      # Runs the moment the box comes back if a window was missed, rather than
      # waiting a full hour after an outage.
      Persistent=true

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/journald.conf.d/tn-worker.conf
    content: |
      [Journal]
      SystemMaxUse=200M
      MaxRetentionSec=2week

runcmd:
  # A dedicated non-root user owns the service. The worker needs no privilege
  # beyond outbound network access.
  - useradd --system --create-home --shell /usr/sbin/nologin worker || true

  # Node 22 LTS from NodeSource; the ARM and x86 builds are both published, so
  # this line is identical whichever shape capacity allowed (§14.4).
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs

  # 2 GB swap. Insurance rather than necessity at 12 GB, and genuinely load
  # bearing if this ever lands on the 1 GB micro fallback.
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - sh -c 'echo "/swapfile none swap sw 0 0" >> /etc/fstab'

  - mkdir -p /opt/tn-worker
  - chown -R worker:worker /opt/tn-worker

  # The transcript service. A venv rather than system pip: yt-dlp needs
  # frequent updates to keep pace with YouTube, and upgrading it must never
  # be able to disturb anything the OS depends on.
  - apt-get install -y python3-venv python3-pip ffmpeg
  - mkdir -p /opt/tn-transcript
  - python3 -m venv /opt/tn-transcript/venv
  - /opt/tn-transcript/venv/bin/pip install --quiet --upgrade pip
  - /opt/tn-transcript/venv/bin/pip install --quiet flask yt-dlp
  - chown -R worker:worker /opt/tn-transcript

  - systemctl daemon-reload
  - systemctl restart systemd-journald
  # Enabled but not started: the code and the secrets arrive by deploy, and a
  # service that starts before either would just crash-loop on boot.
  - systemctl enable tn-worker.service
  - systemctl enable tn-transcript.service
  - systemctl enable tn-enqueue-asr.timer

  # yt-dlp goes stale fast -- YouTube changes, yt-dlp adapts, and a pinned copy
  # silently stops returning transcripts. Weekly self-update keeps the fragile
  # path working without anyone remembering to maintain it.
  - sh -c 'echo "0 4 * * 1 root /opt/tn-transcript/venv/bin/pip install --quiet --upgrade yt-dlp && systemctl restart tn-transcript" > /etc/cron.d/tn-ytdlp-update' 

final_message: "tn host ready after $UPTIME seconds. Deploy worker to /opt/tn-worker and server.py to /opt/tn-transcript, write /etc/tn-worker.env, then: systemctl start tn-worker tn-transcript"
